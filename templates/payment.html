{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="container" style="padding: 60px 0;">
    <h1 style="margin-bottom: 40px;">Личный кабинет</h1>

    <div style="display: flex; gap: 40px;">

        <div style="flex: 1;">
            <div style="background: #C0CCEB; border-radius: 8px; overflow: hidden;">
                <a href="#" style="display: block; padding: 20px; text-decoration: none; color: black; border-bottom: 1px solid #999;">Мои боксы</a>
                <a href="#" style="display: block; padding: 20px; text-decoration: none; color: black; border-bottom: 1px solid #999;">Личные данные</a>
                <div style="padding: 20px; background: var(--primary); color: white;">Способы оплаты</div>
                <a href="{% url 'login' %}" style="display: block; padding: 20px; text-decoration: none; color: black;">Выйти</a>
            </div>
        </div>

        <div style="flex: 3;">
            <h2 style="margin-bottom: 24px;">Способы оплаты</h2>

            <div style="background: #C0CCEB; padding: 40px; border-radius: 8px;">
                <div style="display: flex; gap: 20px; margin-bottom: 32px;">
                    <div style="background: white; padding: 20px; border-radius: 8px; flex: 1; text-align: center; font-weight: bold; color: #F00;">Альфа-Банк</div>
                    <div style="background: white; padding: 20px; border-radius: 8px; flex: 1; text-align: center; font-weight: bold;">Тинькофф</div>
                    <div style="background: white; padding: 20px; border-radius: 8px; flex: 1; text-align: center; font-weight: bold; color: #090;">МИР</div>
                </div>

                <div style="display: flex; justify-content: space-between; margin-bottom: 24px;">
                    <span>Сумма оплаты</span>
                    <span>22 500 руб.</span>
                </div>

                <form action="#" method="post">
                    {% csrf_token %}
                    <div style="margin-bottom: 20px;">
                        <label>Номер карты</label>
                        <input type="text" placeholder=".... .... .... ...." style="width: 100%; padding: 16px; border: none; border-radius: 4px; margin-top: 8px;">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label>Имя на карте</label>
                        <input type="text" placeholder="Введите имя" style="width: 100%; padding: 16px; border: none; border-radius: 4px; margin-top: 8px;">
                    </div>
                    <div style="display: flex; gap: 20px; margin-bottom: 32px;">
                        <div style="flex: 1;">
                            <label>Срок действия</label>
                            <input type="text" placeholder="ДД.ГГГГ" style="width: 100%; padding: 16px; border: none; border-radius: 4px; margin-top: 8px;">
                        </div>
                        <div style="flex: 1;">
                            <label>CVC/CVV</label>
                            <input type="password" placeholder="..." style="width: 100%; padding: 16px; border: none; border-radius: 4px; margin-top: 8px;">
                        </div>
                    </div>

                    <a href="{% url 'profile' %}" class="btn btn--primary" style="width: 100%; display: block;">Подтвердить</a>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
