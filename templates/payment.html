{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="container" style="padding-top: 60px; padding-bottom: 60px;">
    <h1 style="margin-bottom: 40px;">Личный кабинет</h1>

    <div class="page-layout">
        <div class="sidebar-layout">
            <a href="#">Мои боксы</a>
            <a href="#">Личные данные</a>
            <a href="#" style="background: var(--primary); color: white;">Способы оплаты</a>
            <a href="{% url 'login' %}">Выйти</a>
        </div>

        <div class="main-content-layout" style="flex: 3;">
            <h2 style="margin-bottom: 24px;">Способы оплаты</h2>

            <div style="background: var(--bg-card); padding: 32px; border-radius: 8px;">
                <div class="bank-buttons">
                    <div>Альфа-Банк</div>
                    <div>Тинькофф</div>
                    <div>МИР</div>
                </div>

                <div style="display: flex; justify-content: space-between; margin-bottom: 24px;">
                    <span>Сумма оплаты</span>
                    <span>22 500 руб.</span>
                </div>

                <form action="{% url 'profile' %}" method="get">
                    <div style="margin-bottom: 20px;">
                        <label>Номер карты</label>
                        <input type="text" placeholder=".... .... .... ...." class="form-input">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label>Имя на карте</label>
                        <input type="text" placeholder="Введите имя" class="form-input">
                    </div>


                    <div class="form-row" style="margin-bottom: 32px;">
                        <div>
                            <label>Срок действия</label>
                            <input type="text" placeholder="ДД.ГГГГ" class="form-input">
                        </div>
                        <div>
                            <label>CVC/CVV</label>
                            <input type="password" placeholder="..." class="form-input">
                        </div>
                    </div>

                    <button type="submit" class="btn btn--primary" style="width: 100%;">Подтвердить</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
