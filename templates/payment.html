{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="container" style="padding-top: 60px; padding-bottom: 60px;">
    <h1 style="margin-bottom: 40px;">Личный кабинет</h1>

    <div class="page-layout">
        <div class="sidebar-layout">
            <a href="{% url 'profile' %}">Мои боксы</a>
            <a href="{% url 'profile_data' %}">Личные данные</a>
            <a href="{% url 'payment_history' %}" style="background: var(--primary); color: white;">Способы оплаты</a>
            <a href="{% url 'logout' %}">Выйти</a>
        </div>

        <div class="main-content-layout" style="flex: 3;">
            <h2 style="margin-bottom: 24px;">Способы оплаты</h2>

            <div style="background: var(--bg-card); padding: 32px; border-radius: 8px;">
                <div class="bank-buttons">
                    <div>Альфа-Банк</div>
                    <div>Тинькофф</div>
                    <div>МИР</div>
                </div>

                <div style="display: flex; justify-content: space-between; margin-bottom: 24px;">
                    <span>Сумма оплаты</span>
                    <span>{{ total_rent }} руб.</span>
                </div>

                <form method="post">
                    {% csrf_token %}
<!-- Fix BUG-04: Маска для карты -->
                    <div style="margin-bottom: 20px;">
    <label>Номер карты</label>
    <input type="text" id="card-number" placeholder=".... .... .... ...." class="form-input" maxlength="19" oninput="this.value = this.value.replace(/[^0-9 ]/g, '').replace(/(.{4})/g, '$1 ').trim();" required>
</div>
<div style="margin-bottom: 20px;">
    <label>Имя на карте</label>
    <input type="text" placeholder="Введите имя" class="form-input" pattern="^[A-Za-z\s]+$" title="Только латинские буквы" required>
</div>
<div class="form-row" style="margin-bottom: 32px;">
    <div>
        <label>Срок действия</label>
        <input type="text" placeholder="ММ/ГГ" class="form-input" maxlength="5" oninput="this.value = this.value.replace(/[^0-9/]/g, '');" required>
    </div>
    <div>
        <label>CVC/CVV</label>
        <input type="password" placeholder="..." class="form-input" maxlength="3" oninput="this.value = this.value.replace(/[^0-9]/g, '');" required>
    </div>
</div>

                    <button type="submit" class="btn btn--primary" style="width: 100%;">Подтвердить</button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
