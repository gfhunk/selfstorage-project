{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container" style="display:flex; justify-content:center; padding: 80px 0;">
    <div class="auth-box" style="width: 500px; background: #C0CCEB; border-radius: 8px; overflow:hidden;">
        <div style="display:flex;">
            <div style="width:50%; text-align:center; padding:20px; background:var(--primary); color:white;">Регистрация</div>
            <a href="{% url 'login' %}" style="width:50%; text-align:center; padding:20px; text-decoration:none; color:#212529;">Вход</a>
        </div>

        <form method="post" style="padding: 40px;">
            {% csrf_token %}
            <h2>Создать аккаунт</h2>
            <p>Заполните данные для регистрации</p>

            <div class="filter-group" style="margin-top:20px;">
                <label>Имя</label>
                <input type="text" name="username" placeholder="Введите имя" required style="width:100%; padding:12px; border:none; border-radius:4px;">
            </div>
            <div class="filter-group" style="margin-top:20px;">
                <label>Телефон</label>
                <input type="tel" name="phone" placeholder="+7 (___) ___-__-__" required style="width:100%; padding:12px; border:none; border-radius:4px;">
            </div>
            <div class="filter-group" style="margin-top:20px;">
                <label>Электронная почта</label>
                <input type="email" name="email" placeholder="mail@example.ru" required style="width:100%; padding:12px; border:none; border-radius:4px;">
            </div>
            <div class="filter-group" style="margin-top:20px;">
                <label>Пароль</label>
                <input type="password" name="password" placeholder="Введите пароль" required style="width:100%; padding:12px; border:none; border-radius:4px;">
            </div>

            <button type="submit" class="btn btn--primary" style="width:100%; margin-top:30px;">Зарегистрироваться</button>

            <div style="text-align:center; margin: 20px 0;">— или —</div>

            <button type="button" class="btn" style="width:100%; background:white; color:#212529;">Войти по коду из SMS</button>
        </form>
    </div>
</div>
{% endblock %}
