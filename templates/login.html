{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container" style="display:flex; justify-content:center; padding: 80px 0;">
    <div class="auth-box" style="width: 500px; background: #C0CCEB; border-radius: 8px; overflow:hidden;">
        <div style="display:flex;">
            <a href="{% url 'register' %}" style="width:50%; text-align:center; padding:20px; text-decoration:none; color:#212529;">Регистрация</a>
            <div style="width:50%; text-align:center; padding:20px; background:var(--primary); color:white;">Вход</div>
        </div>

        <form method="post" style="padding: 40px;">
    {% csrf_token %}
    <h2>Войти в аккаунт.</h2>

    {% for field in form %}
        <div class="filter-group" style="margin-top:20px;">
            <label>{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div style="color: #DC3545; font-size: 14px; margin-top: 4px;">{{ field.errors.0 }}</div>
            {% endif %}
        </div>
    {% endfor %}

    <button type="submit" class="btn btn--primary" style="width:100%; margin-top:30px;">Войти</button>
</form>
    </div>
</div>
{% endblock %}
