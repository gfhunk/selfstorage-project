{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
    <header class="header">
        <div class="container header__container">
            <a href="{% url 'home' %}" class="logo">
                <img src="{% static 'images/logo.svg' %}" alt="Логотип" width="40" height="40">
                <span>SelfStorage</span>
            </a>
            <nav class="nav">

                <a href="{% url 'catalog' %}" class="nav__link">Каталог</a>
                <a href="#" class="nav__link">Калькулятор</a>
                <a href="{% url 'profile' %}" class="nav__link">Войти</a>
            </nav>
            <button class="burger"><span></span><span></span><span></span></button>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <div class="container footer__container">
            <p>&copy; 2026 SelfStorage. Все права защищены.</p>
        </div>
    </footer>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
